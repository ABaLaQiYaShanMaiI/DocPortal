[mypy]
python_version = 3.10
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
# Do NOT globally ignore missing imports — only whitelist specific modules below.
ignore_missing_imports = false

# Optional dependency: tkinterdnd2 (GUI drag-and-drop)
[mypy-tkinterdnd2]
ignore_missing_imports = true

# Optional dependency: python-magic (native libmagic, not on Windows)
[mypy-magic]
ignore_missing_imports = true

# Optional dependencies used via lazy imports / TYPE_CHECKING
[mypy-python_docx.*]
ignore_missing_imports = true

[mypy-pptx.*]
ignore_missing_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-pdfminer.*]
ignore_missing_imports = true

[mypy-chardet]
ignore_missing_imports = true
